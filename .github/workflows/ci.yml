name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The Anvil binary comes from an optional dependency; its postinstall is not needed.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - name: Contract artifacts match the sources
        run: npm run compile && git diff --exit-code contracts/out
      - run: npm test
      - run: npm run build
